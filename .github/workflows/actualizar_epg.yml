name: Actualizar EPG

on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC = 03:00 en Ecuador (UTC-5)
  workflow_dispatch: # para ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-epg
  cancel-in-progress: false

jobs:
  generar-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Generar la guía
        run: node index.js

      - name: Verificar que la guía no quedó incompleta
        run: |
          nuevo=$(grep -c '<programme' mi_guia.xml)
          anterior=$(git show HEAD:mi_guia.xml 2>/dev/null | grep -c '<programme' || true)
          echo "Programas: ahora=$nuevo, antes=$anterior"
          if [ "$nuevo" -lt 1000 ] || [ "$nuevo" -lt $((anterior * 7 / 10)) ]; then
            echo "::error::La guía quedó mucho más pequeña que la anterior (¿alguna fuente bloqueó a GitHub?). No se sube."
            exit 1
          fi

      - name: Subir mi_guia.xml si cambió
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mi_guia.xml
          if git diff --staged --quiet; then
            echo "Sin cambios en mi_guia.xml."
          else
            git commit -m "Actualización automática del EPG"
            # --autostash guarda temporalmente cualquier otro archivo modificado
            # (p. ej. package-lock.json tras npm install) para que el pull no falle.
            # -X theirs: si hay conflicto en mi_guia.xml, gana la guía recién generada.
            git pull --rebase --autostash -X theirs
            git push
          fi
